version: '3.8'

services:
  # ── Main FAGE Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Secrets — override with real values in production
      - DATABASE_URL=postgresql://fage_user:secure_password@postgres-db.internal:5432/fage_db
      - FAGE_JWT_SECRET=${FAGE_JWT_SECRET}
      - FAGE_AUDIT_HMAC_KEY=${FAGE_AUDIT_HMAC_KEY}
      - FAGE_ENCRYPTION_KEY=${FAGE_ENCRYPTION_KEY}
      - FAGE_ENV=${FAGE_ENV:-production}
      # Security toggles (set to "true" to disable for local dev only)
      - FAGE_DISABLE_BT_LOCK=${FAGE_DISABLE_BT_LOCK:-false}
      - FAGE_DISABLE_FIREWALL=${FAGE_DISABLE_FIREWALL:-false}
      - FAGE_STRICT_BT_LOCK=false
      - FAGE_HIDS_EMERGENCY_LOCKDOWN=false
    depends_on:
      - postgres-db.internal
    networks:
      - fage-network
    volumes:
      # Shared volumes — quarantine is read-only for main app
      - quarantine_data:/quarantine:ro
      - uploads_data:/uploads
      - security_logs:/app/security/logs
    # ── Security hardening ────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # Only needed if binding to port < 1024
    read_only: false        # Set true once write paths are tmpfs-mounted
    tmpfs:
      - /tmp:size=128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── File Sandbox (ClamAV, network-isolated) ──────────────────────────────────
  sandbox:
    build:
      context: .
      dockerfile: security/sandbox/Dockerfile.sandbox
    image: fage-sandbox
    # CRITICAL: No network access — sandbox is completely isolated
    network_mode: "none"
    volumes:
      - inbox_data:/inbox:ro           # Incoming files (read-only for sandbox)
      - quarantine_data:/quarantine:rw  # Quarantine output (sandbox writes here)
      - uploads_data:/uploads:rw        # Clean files output
    # Run as minimal permissions
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped

  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  postgres-db.internal:
    image: postgres:15
    environment:
      - POSTGRES_USER=fage_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
      - POSTGRES_DB=fage_db
    ports:
      - "127.0.0.1:5432:5432"   # Bind to localhost ONLY — not 0.0.0.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fage-network
    # Security hardening for database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fage_user -d fage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  quarantine_data:   # Sandbox writes quarantined files here
  uploads_data:      # Sandbox writes clean files here
  inbox_data:        # Incoming files to be scanned
  security_logs:     # Audit logs (persistent)

networks:
  fage-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
